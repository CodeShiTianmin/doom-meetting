name: meeting_app
description: 漫映网络科技 - 投屏会议手机客户端 (Flutter)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # 媒体: LiveKit SFU 客户端 (WebRTC, DTLS-SRTP 加密)
  livekit_client: ^2.2.4
  # 远端音频轨音量(Helper.setVolume), 版本由 livekit_client 约束
  flutter_webrtc: ">=0.11.6 <2.0.0"
  # 业务信令: STOMP over WebSocket
  stomp_dart_client: ^2.0.0
  # HTTP 客户端
  dio: ^5.4.3
  # 二维码扫码入会
  mobile_scanner: ^5.1.1
  # 图库选图识别二维码
  image_picker: ^1.1.2
  # 麦克风/摄像头权限
  permission_handler: ^11.3.1
  # 会议中屏幕常亮
  wakelock_plus: ^1.2.5
  # 离开 APP 时画中画悬浮窗(Android)
  floating: ^6.0.0
  # 离开 APP 时推流画面画中画(iOS, vendored)
  livekit_pip:
    path: packages/livekit_pip
  # 本地亮度调节
  screen_brightness: ^1.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
