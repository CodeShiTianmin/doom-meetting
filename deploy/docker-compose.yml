# 多房并发投屏会议软件 - 部署编排
# Nginx + Spring Boot + LiveKit(自部署 SFU, 关闭录制, 内置 TURN) + MySQL
version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: doom-meeting-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: doom_meeting
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"

  meeting-server:
    build:
      context: ../meeting-server
    container_name: doom-meeting-server
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: doom_meeting
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-devsecret-devsecret-32}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-wss://your-domain:7880}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ZG9vbS1tZWV0aW5nLXNlcnZlci1qd3Qtc2VjcmV0LWtleS0yMDI2LXZlcnktbG9uZw==}
    ports:
      - "8080:8080"

  livekit:
    image: livekit/livekit-server:latest
    container_name: doom-meeting-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # host 网络: WebRTC 媒体需向客户端通告真实可达的 IP:端口,
    # bridge 端口映射会导致 ICE candidate 与实际监听地址不一致, 连接超时。
    # 使用端口: 7880/tcp(信令) 7881/tcp(ICE-TCP 回退) 3478/udp(TURN) 50000-50200/udp(媒体)
    # 以上端口需在服务器防火墙/云安全组放行
    network_mode: host
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

  nginx:
    image: nginx:stable
    container_name: doom-meeting-nginx
    restart: unless-stopped
    depends_on:
      - meeting-server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../meeting-admin/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  mysql-data:
